services:
  # ===================
  # Database
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: hivemi-postgres
    environment:
      POSTGRES_USER: hivemi
      POSTGRES_PASSWORD: hivemi
      POSTGRES_DB: hivemi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================
  # Registry
  # ===================
  registry:
    build:
      context: .
      dockerfile: apps/registry/Dockerfile
    container_name: hivemi-registry
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=postgresql://hivemi:hivemi@postgres:5432/hivemi
      - HIVEMI_SECRET=${HIVEMI_SECRET}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  # ===================
  # Manager
  # ===================
  manager:
    build:
      context: .
      dockerfile: apps/manager/Dockerfile
    container_name: hivemi-manager
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REGISTRY_URL=http://registry:4001
      - HIVEMI_SECRET=${HIVEMI_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      - registry

  # ===================
  # Dashboard
  # ===================
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: hivemi-dashboard
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://manager:4000
    ports:
      - "3000:3000"
    depends_on:
      - manager

volumes:
  postgres_data:
