services:
  # ===================
  # Database
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: hivemi-postgres
    environment:
      POSTGRES_USER: hivemi
      POSTGRES_PASSWORD: hivemi
      POSTGRES_DB: hivemi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemi"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No external port - only accessible within Docker network

  # ===================
  # Registry (internal)
  # ===================
  registry:
    build:
      context: .
      dockerfile: apps/registry/Dockerfile
    container_name: hivemi-registry
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=postgresql://hivemi:hivemi@postgres:5432/hivemi
      - HIVEMI_SECRET=${HIVEMI_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    # No external port - only accessible within Docker network

  # ===================
  # Manager (internal)
  # ===================
  manager:
    build:
      context: .
      dockerfile: apps/manager/Dockerfile
    container_name: hivemi-manager
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REGISTRY_URL=http://registry:4001
      - HIVEMI_SECRET=${HIVEMI_SECRET}
    depends_on:
      - registry
    # No external port - only accessible within Docker network

  # ===================
  # Dashboard (the only exposed service)
  # ===================
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: hivemi-dashboard
    environment:
      - NODE_ENV=production
      - REGISTRY_URL=http://registry:4001
      - MANAGER_URL=http://manager:4000
    ports:
      - "3000:3000"  # Only exposed port
    depends_on:
      - registry
      - manager

volumes:
  postgres_data:
